        .btn-back-top {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;

        .menu-block-title {

            text-align: left;
            margin: 15px 0 8px 0;
            font-weight: bold;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }
        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .grammar-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .btn-section {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #334155;

        .btn-section:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;

        }
        .btn-vocab-mode {
            width: 100%;
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;

            border: none;
            text-align: left;

            font-weight: bold;

            background-color: #0369a1;
        }

            font-size: 1.15rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .answer-area {
            min-height: 50px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            background: #f8fafc;

            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 50px;

            font-weight: bold;

        .score-board { margin-top: 15px; font-size: 1rem; font-weight: bold; color: #64748b; }

            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;

    </style>
</head>

<!-- Layar Utama (Menu) -->
<div id="menu-screen" class="quiz-card">

        <button class="btn-grammar-mode" onclick="startGrammarMode('vtvi')">7. Transitive & Intransitive (Vt/Vi)</button>

        { q: "Bentuk plural irregular (tidak beraturan) dari 'child' adalah...", options: ["children", "childs", "childes", "childrens"], ans: "children" },
        { q: "Manakah kata benda (noun) yang berbentuk uncountable?", options: ["coffee (kopi)", "cup (cangkir)", "plate (piring)", "fork (garpu)"], ans: "coffee (kopi)" }
    ],
    pronouns: [
        { q: "Pronoun subject untuk menggantikan nama 'Budi' adalah...", options: ["he", "him", "his", "himself"], ans: "he" },
        { q: "This book belongs to me. It is ... book. (Possessive Adjective)", options: ["my", "mine", "me", "myself"], ans: "my" },
        { q: "Can you help ...? (Pronoun sebagai Object)", options: ["me", "my", "mine", "myself"], ans: "me" },
        { q: "The pen is not yours, it is ... (Possessive Pronoun)", options: ["mine", "my", "me", "myself"], ans: "mine" },
        { q: "I cut ... while cooking yesterday. (Reflexive Pronoun)", options: ["myself", "me", "my", "mine"], ans: "myself" },
        { q: "She loves ... cat very much. (Possessive Adjective)", options: ["her", "she", "hers", "herself"], ans: "her" },
        { q: "This is our food. It is ... (Possessive Pronoun)", options: ["ours", "our", "us", "we"], ans: "ours" }
    ]
};

let mode = "sentence"; // 'sentence', 'vocab', atau 'grammar'
let activeQuizData = [];
let currentQuestion = 0;
let score = 0;
let mistakes = []; 
let currentCorrectAnswer = "";
let currentQuestionText = "";

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function backToMenu() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('menu-screen').style.display = 'block';
}

// Handler Menu Pilihan
function startSection(sectionNumber) {
    mode = "sentence";
    const startIndex = (sectionNumber - 1) * 7;
    const endIndex = startIndex + 7;
    activeQuizData = quizData.slice(startIndex, endIndex);
    activeQuizData = shuffle(activeQuizData); 
    initQuizScreen(`Section ${sectionNumber}`);
}

function startVocabMode() {
    mode = "vocab";
    activeQuizData = shuffle([...specialVocabData]).slice(0, 10);
    initQuizScreen("🔥 Vocab Spesial");
}

function startGrammarMode(topicKey) {
    mode = "grammar";
    activeQuizData = grammarData[topicKey];
    initQuizScreen("📖 Latihan Grammar");
}

function initQuizScreen(title) {
    currentQuestion = 0;
    score = 0;
    mistakes = []; 

    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('quiz-title').innerText = title;
    document.getElementById('back-menu-btn').style.display = 'none';
    document.getElementById('score').style.display = 'block';
    document.getElementById('correction-container').style.display = 'none';
    document.getElementById('correction-container').innerHTML = '';

    loadQuestion();
}

function loadQuestion() {
    document.getElementById('feedback-msg').innerHTML = '';
    
    if (mode === "sentence") {
        loadSentenceQuestion();
    } else if (mode === "vocab") {
        loadVocabQuestion();
    } else if (mode === "grammar") {
        loadGrammarQuestion();
    }
}

// 1. Mode Susun Kalimat
function loadSentenceQuestion() {
    document.getElementById('answer-area').style.display = 'flex';
    document.getElementById('word-pool').style.display = 'flex';
    document.getElementById('options-container').style.display = 'none';

    const q = activeQuizData[currentQuestion];
    let cleanedString = q.en.replace(/[.,?!*()]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
    
    currentCorrectAnswer = cleanedString;
    currentQuestionText = q.id;
    
    document.getElementById('indonesian').innerHTML = `${currentQuestion + 1}. ${q.id}`;
    
    const answerArea = document.getElementById('answer-area');
    const wordPool = document.getElementById('word-pool');
    
    answerArea.innerHTML = '';
    wordPool.innerHTML = '';
    answerArea.className = 'answer-area'; 
    
    let correctWords = currentCorrectAnswer.split(' ');
    let decoyWords = [];
    quizData.forEach(item => {
        if (item.en !== q.en) {
            let cleanItem = item.en.replace(/[.,?!*()]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
            decoyWords.push(...cleanItem.split(' '));
        }
    });
    decoyWords = [...new Set(decoyWords)].filter(w => !correctWords.includes(w) && w.length > 0);
    decoyWords = shuffle(decoyWords);
    let selectedDecoys = decoyWords.slice(0, 3);
    
    let finalWords = shuffle(correctWords.concat(selectedDecoys));

    finalWords.forEach(w => {
        const wordBtn = document.createElement('div');
        wordBtn.className = 'word-card';
        wordBtn.innerText = w;
        wordBtn.onclick = () => moveWord(wordBtn);
        wordPool.appendChild(wordBtn);
    });

    document.getElementById('check-btn').style.display = 'block';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('score').innerText = `Skor: ${score} / ${activeQuizData.length}`;
}

// 2. Mode Vocab Spesial
function loadVocabQuestion() {
    document.getElementById('answer-area').style.display = 'none';
    document.getElementById('word-pool').style.display = 'none';
    document.getElementById('check-btn').style.display = 'none';
    
    const optContainer = document.getElementById('options-container');
    optContainer.style.display = 'flex';
    optContainer.innerHTML = '';

    const q = activeQuizData[currentQuestion];
    currentCorrectAnswer = q.meaning;
    currentQuestionText = q.word;

    document.getElementById('indonesian').innerHTML = `${currentQuestion + 1}. Apa arti dari <u>"${q.word}"</u>?`;

    let options = [q.meaning];
    while(options.length < 4) {
        let randMeaning = specialVocabData[Math.floor(Math.random() * specialVocabData.length)].meaning;
        if (!options.includes(randMeaning)) options.push(randMeaning);
    }
    options = shuffle(options);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkOptionAnswer(btn, opt);
        optContainer.appendChild(btn);
    });

    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('score').innerText = `Skor: ${score} / ${activeQuizData.length}`;
}

// 3. Mode Grammar
function loadGrammarQuestion() {
    document.getElementById('answer-area').style.display = 'none';
    document.getElementById('word-pool').style.display = 'none';
    document.getElementById('check-btn').style.display = 'none';
    
    const optContainer = document.getElementById('options-container');
    optContainer.style.display = 'flex';
    optContainer.innerHTML = '';

    const q = activeQuizData[currentQuestion];
    currentCorrectAnswer = q.ans;
    currentQuestionText = q.q;

    document.getElementById('indonesian').innerHTML = `${currentQuestion + 1}. ${q.q}`;

    let options = shuffle([...q.options]);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkOptionAnswer(btn, opt);
        optContainer.appendChild(btn);
    });

    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('score').innerText = `Skor: ${score} / ${activeQuizData.length}`;
}

function moveWord(wordElement) {
    const wordPool = document.getElementById('word-pool');
    const answerArea = document.getElementById('answer-area');
    if (wordElement.parentElement === wordPool) {
        answerArea.appendChild(wordElement);
    } else {
        wordPool.appendChild(wordElement);
    }
}

function checkSentenceAnswer() {
    const answerArea = document.getElementById('answer-area');
    const feedback = document.getElementById('feedback-msg');
    
    const userWords = Array.from(answerArea.children).map(card => card.innerText);
    const userAnswer = userWords.join(' ');
    
    document.querySelectorAll('.word-card').forEach(card => card.classList.add('disabled'));
    
    if (userAnswer === currentCorrectAnswer) {
        answerArea.classList.add('correct-border');
        feedback.innerHTML = '<span style="color: #22c55e;">✅ Sempurna!</span>';
        score++;
    } else {
        answerArea.classList.add('wrong-border');
        feedback.innerHTML = `<span style="color: #ef4444;">❌ Kurang tepat.</span><br><span style="font-size: 0.9rem; color: #475569;">Jawaban benar: <b>${currentCorrectAnswer}</b></span>`;
        mistakes.push({ question: currentQuestionText, wrongAns: userAnswer || "(Kosong)", correctAns: currentCorrectAnswer });
    }

    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('score').innerText = `Skor: ${score} / ${activeQuizData.length}`;
}

function checkOptionAnswer(selectedBtn, selectedOpt) {
    const buttons = document.querySelectorAll('.btn-option');
    buttons.forEach(btn => btn.disabled = true);

    const feedback = document.getElementById('feedback-msg');

    if (selectedOpt === currentCorrectAnswer) {
        selectedBtn.classList.add('correct');
        feedback.innerHTML = '<span style="color: #22c55e;">✅ Benar Sekali!</span>';
        score++;
    } else {
        selectedBtn.classList.add('wrong');
        feedback.innerHTML = `<span style="color: #ef4444;">❌ Kurang Tepat.</span>`;
        buttons.forEach(btn => {
            if(btn.innerText === currentCorrectAnswer) btn.classList.add('correct');
        });
        mistakes.push({ question: currentQuestionText, wrongAns: selectedOpt, correctAns: currentCorrectAnswer });
    }

    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('score').innerText = `Skor: ${score} / ${activeQuizData.length}`;
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < activeQuizData.length) {
        loadQuestion();
    } else {
        let wrongCount = mistakes.length;
        document.getElementById('indonesian').innerHTML = `🎉 Selesai!<br>Benar: <span style="color: #22c55e;">${score}</span> | Salah: <span style="color: #ef4444;">${wrongCount}</span>`;
        
        document.getElementById('answer-area').style.display = 'none';
        document.getElementById('word-pool').style.display = 'none';
        document.getElementById('options-container').style.display = 'none';
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback-msg').innerHTML = '';
        document.getElementById('score').style.display = 'none'; 
        
        if (wrongCount > 0) {
            let corrHTML = '<h4>Koreksi Jawaban:</h4>';
            mistakes.forEach((m, index) => {
                corrHTML += `
                <div class="correction-item">
                    <div class="corr-q">${index + 1}. ${m.question}</div>
                    <div class="corr-w">❌ Jawabanmu: ${m.wrongAns}</div>
                    <div class="corr-c">✅ Seharusnya: ${m.correctAns}</div>
                </div>`;
            });
            const corrContainer = document.getElementById('correction-container');
            corrContainer.innerHTML = corrHTML;
            corrContainer.style.display = 'block'; 
        }

        document.getElementById('back-menu-btn').style.display = 'block';
    }
}
</script>
