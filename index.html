<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Bahasa Inggris (Hal 41-45)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .quiz-card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        /* --- Menu Section Styles --- */
        .section-title {
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-section {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-section:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        /* --- Quiz Styles --- */
        .indonesian-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            min-height: 60px; /* Menjaga layout tidak lompat */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-option {
            background-color: #eef2f7;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .btn-option:hover {
            background-color: #e2e8f0;
        }
        .correct {
            background-color: #4ade80 !important;
            border-color: #22c55e !important;
            color: #ffffff;
        }
        .wrong {
            background-color: #f87171 !important;
            border-color: #ef4444 !important;
            color: #ffffff;
        }
        .score-board {
            margin-top: 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #64748b;
        }
        .btn-action {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-action:hover {
            background-color: #1d4ed8;
        }
        .btn-menu {
            background-color: #475569;
        }
        .btn-menu:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

<!-- Layar Utama (Menu) -->
<div id="menu-screen" class="quiz-card">
    <h2 class="section-title">Pilih Bagian Latihan</h2>
    <div class="section-grid">
        <button class="btn-section" onclick="startSection(1)">Section 1</button>
        <button class="btn-section" onclick="startSection(2)">Section 2</button>
        <button class="btn-section" onclick="startSection(3)">Section 3</button>
        <button class="btn-section" onclick="startSection(4)">Section 4</button>
        <button class="btn-section" onclick="startSection(5)">Section 5</button>
        <button class="btn-section" onclick="startSection(6)">Section 6</button>
        <button class="btn-section" onclick="startSection(7)">Section 7</button>
        <button class="btn-section" onclick="startSection(8)">Section 8</button>
    </div>
</div>

<!-- Layar Kuis -->
<div id="quiz-screen" class="quiz-card" style="display: none;">
    <h3 id="quiz-title">Latihan Bahasa Inggris</h3>
    <div id="indonesian" class="indonesian-text">Loading...</div>
    <div id="options" class="options-container"></div>
    
    <button id="next-btn" class="btn-action" onclick="nextQuestion()">Soal Berikutnya</button>
    <button id="back-menu-btn" class="btn-action btn-menu" onclick="backToMenu()">Kembali ke Menu</button>
    
    <div id="score" class="score-board">Skor: 0</div>
</div>

<script>
// Total 56 Soal (8 Section x 7 Soal)
const quizData = [
    // Halaman 41
    { id: "Udah sarapan?", en: "You got your breakfast?" },
    { id: "Udah sarapan?", en: "Have you got your breakfast?" },
    { id: "Menu apa buat sarapan?", en: "What's for breakfast?" },
    { id: "Aku lapar. (starving)", en: "I'm starving." },
    { id: "Aku lapar. (hungry)", en: "I'm hungry." },
    { id: "Perutku keroncongan.", en: "My stomach is growling." },
    { id: "Nyari makan yuk.", en: "Let's get something to eat." },
    { id: "Mau makan siang apa?", en: "What do you want for lunch?" },
    { id: "Selera makan ku hilang.", en: "I lost my appetite." },
    { id: "Kayanya aku mau muntah.", en: "I'm feeling like I wanna throw up." },
    { id: "Mungkin kamu masuk angin.", en: "Maybe you catch a cold." },
    { id: "Kamu masak apa?", en: "What are you cooking?" },
    { id: "Baunya bikin ngiler.", en: "The smell makes me water my mouth." },

    // Halaman 42
    { id: "Aku ga suka masak.", en: "I don't like cooking." },
    { id: "Aku tukang masak yang buruk.", en: "I'm a bad cook." }, // Diperbaiki dari 'buru'
    { id: "Terlalu asin/ keasinan.", en: "It's too salty." },
    { id: "Kamu harus tambahin gula lagi.", en: "You need to add some more sugar." },
    { id: "Aku suka makanan cepat saji.", en: "I like fast food." },
    { id: "Cafe di ujung jalan sana payah.", en: "The cafe in the corner is terrible." },
    { id: "Itu rumah makan prasmanan?", en: "Is it a buffet restaurant?" },
    { id: "Itu rumah makan *a la carte.", en: "It's an ala carte restaurant." },
    { id: "Pelayanannya bagus tapi masakannya payah.", en: "The service is good, but the cook sucks." }, // Diperbaiki typo
    { id: "Bisa beliin makan siang ga?", en: "Can you buy me my lunch?" },
    { id: "Bisa nitip makanan ga?", en: "Can you get me something to eat?" },
    { id: "Kamu keliatan capek. Mau ngopi sama aku?", en: "You look tired. Would you like to have a cup of coffee with me ?" },

    // Halaman 43
    { id: "Aku traktir.", en: "It's my treat." },
    { id: "Emang sekarang aku butuh cafein.", en: "Caffeine is exactly what I need right now." }, // Diperbaiki typo
    { id: "Cuci tanganmu dulu sebelum makan.", en: "Wash your hands before eating." },
    { id: "Aku ga suka makan pake sendok.", en: "I don't like to eat with spoon." },
    { id: "Jangan ngecap.", en: "Don't smack your lips." },
    { id: "Ada sesuatu di gigi kamu.", en: "You got something on your tooth." },
    { id: "Jangan bersihin gigi di depan umum.", en: "Don't pick your tooth in public." },
    { id: "Kamu makannya banyak.", en: "You eat like a horse." },
    { id: "Kamu makannya sedikit.", en: "You eat like a bird." },
    { id: "Saya vegetarian.", en: "I am a vegan." },
    { id: "Saya gak makan daging.", en: "I don't eat meat." },
    { id: "Saya gak suka daging.", en: "I don't like meat." },
    { id: "Saya gak suka ikan.", en: "I hate fish." },

    // Halaman 44
    { id: "Aku gak suka ikan karna bau amis.", en: "I don't like fish because it's fishy." },
    { id: "Saya lebih suka beli makanan dari pada masak.", en: "I'd rather buy food than cook." },
    { id: "Saya benar-benar suka makanan pedas.", en: "I love spicy food like crazy." },
    { id: "Terlalu banyak makan nasi gak baik buat kesehatan kamu.", en: "Eating too much rice is not good for your health." },
    { id: "Mau nyobain?", en: "Have a bite?" },
    { id: "Tambah lagi!", en: "Have some more!" },
    { id: "Rasanya enak.", en: "The taste is good." },
    { id: "Ini terlalu matang.", en: "It's overcooked." },
    { id: "Ini kembaliannya.", en: "Here is your change." },
    { id: "Punya uang pecaan kecil?", en: "Do you have a small change?" },
    { id: "Bisa nukar uang 50 ribu?", en: "Could you break a Rp. 50.000 (50's) for me?" },
    { id: "Ok. Mau pecahan berapa?", en: "Sure. How do you want it?" },
    { id: "20 ribuan 2 dan sisanya 10 ribu?", en: "Could I have two 20's and the rest in ten?" },

    // Halaman 45
    { id: "Maaf, kayanya uang kembaliannya keliru.", en: "Excuse me, I think you've given me the wrong change." },
    { id: "Bau nya enak.", en: "The smell is good." },
    { id: "Aku nyium bau gosong.", en: "I smell something burning." },
    { id: "Ya ampun! Aku lupa matiin kompor.", en: "OMG! I forgot to turn off the stove." },
    { id: "Rasanya basi!", en: "It tastes stale!" }
];

let activeSectionData = [];
let currentQuestion = 0;
let score = 0;

// Fungsi untuk mengacak array
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

// Fungsi kembali ke menu
function backToMenu() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('menu-screen').style.display = 'block';
}

// Fungsi memulai section
function startSection(sectionNumber) {
    // Menghitung index awal dan akhir berdasarkan nomor section (7 soal per section)
    const startIndex = (sectionNumber - 1) * 7;
    const endIndex = startIndex + 7;
    
    // Mengambil 7 soal untuk section ini
    activeSectionData = quizData.slice(startIndex, endIndex);
    
    // Acak urutan 7 soal tersebut agar tidak berurutan terus
    activeSectionData = shuffle(activeSectionData); 

    // Reset variabel
    currentQuestion = 0;
    score = 0;

    // Ubah tampilan
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('quiz-title').innerText = `Section ${sectionNumber}`;
    document.getElementById('back-menu-btn').style.display = 'none';
    document.getElementById('options').style.display = 'flex';

    loadQuestion();
}

function loadQuestion() {
    const q = activeSectionData[currentQuestion];
    document.getElementById('indonesian').innerText = `${currentQuestion + 1}. ${q.id}`;

    // Ambil opsi jawaban: 1 benar, 3 salah (diambil acak dari SELURUH quizData)
    let options = [q.en];
    while(options.length < 4) {
        let randomOption = quizData[Math.floor(Math.random() * quizData.length)].en;
        if(!options.includes(randomOption)) {
            options.push(randomOption);
        }
    }
    
    // Acak posisi pilihan ganda
    options = shuffle(options);

    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, q.en);
        optionsContainer.appendChild(btn);
    });

    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('score').innerText = `Skor: ${score} / 7`;
}

function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
    const buttons = document.querySelectorAll('.btn-option');
    // Matikan semua tombol setelah memilih
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOpt === correctOpt) {
        selectedBtn.classList.add('correct');
        score++;
    } else {
        selectedBtn.classList.add('wrong');
        // Tunjukkan jawaban yang benar
        buttons.forEach(btn => {
            if(btn.innerText === correctOpt) btn.classList.add('correct');
        });
    }

    document.getElementById('score').innerText = `Skor: ${score} / 7`;
    
    // Tampilkan tombol "Soal Berikutnya"
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < activeSectionData.length) {
        loadQuestion();
    } else {
        // Section Selesai
        document.getElementById('indonesian').innerHTML = `🎉 Selesai!<br>Skor Akhir Kamu: ${score} / 7`;
        document.getElementById('options').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('score').innerText = ''; // Sembunyikan skor bawah karena sudah dipindah ke tengah
        
        // Tampilkan tombol kembali ke menu
        document.getElementById('back-menu-btn').style.display = 'block';
    }
}
</script>

</body>
</html>
